# Unique id for this backend server (example: survie, farm).
# Set it per backend instance.
server-id: ""

# If server-id is in this list, death transfer marker is not sent on that server.
# Example: keep deaths local on survie because it's already in Velocity try list.
disable-death-transfer-on-servers:
  - "survie"

# Target backend server for death transfer.
# You can use:
# - a real backend name (e.g. "survie")
# - "try" to use the first entry from try-order-servers below.
death-transfer-server: "try"

# Used when death-transfer-server is "try".
# Keep same order as Velocity attempt-connection-order.
try-order-servers:
  - "survie"
  - "farm"

# Use Bungee/Velocity plugin-message Connect transfer before fallback kick marker.
use-plugin-message-transfer: true

